name: Security & Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security:
    name: Security checks and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies and tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install -r requirements.upgraded.txt || true
          pip install bandit pip-audit safety

      - name: Create logs dir
        run: mkdir -p logs/security

      - name: Run bandit
        run: bandit -r app -f json -o logs/security/bandit.json || true

      - name: Run pip-audit
        run: pip-audit -r requirements.txt -r requirements.upgraded.txt -f json -o logs/security/pip_audit.json || true

      - name: Run safety
        run: safety check -r requirements.txt --json > logs/security/safety.json || true

      - name: Run tests
        run: python -m pytest -q

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: logs/security
