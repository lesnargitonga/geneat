name: Auto-create PR for security branches

on:
  push:
    branches:
      - 'security/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  create_pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create PR via API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch=${GITHUB_REF#refs/heads/}
          export BRANCH="$branch"
          export TITLE="Auto PR: $branch"
          export BODY="Auto-generated PR for branch $branch"

          payload=$(python - <<'PY'
import os, json
print(json.dumps({
  'title': os.environ['TITLE'],
  'head': os.environ['BRANCH'],
  'base': 'main',
  'body': os.environ['BODY']
}))
PY
)

          curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "$payload" "https://api.github.com/repos/${{ github.repository }}/pulls" \
            | python -c "import sys, json; o=json.load(sys.stdin); print(o.get('html_url') or o.get('message') or '')" || true
