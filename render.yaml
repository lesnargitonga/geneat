services:
  - name: hazina-api
    type: web
    runtime: docker
    repo: https://github.com/lesnargitonga/geneat
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    healthCheckPath: /readyz
    envVars:
      - key: APP_ENV
        value: prod
      - key: LOG_LEVEL
        value: INFO
      - key: UVICORN_WORKERS
        value: "1"
      - key: DEFAULT_BUSINESS_SLUG
        value: hazina-nomads
      - key: HAZINA_CLAIMS_META_PHONE
        value: "true"
      - key: EXPECTED_RENDER_REGION
        value: frankfurt
      - key: DATABASE_REGION
        value: frankfurt
      - key: REDIS_REGION
        value: frankfurt
      - key: PUBLIC_HAZINA_PORTAL_URL
        value: https://hazina.lesnarai.co.ke
      - key: DEMO_BUSINESS_SLUG
        value: lily-pond-cafe
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_FALLBACK_PROVIDERS
        value: groq
      - key: EMBED_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_REASONING_EFFORT
        value: low
      - key: OPENAI_USE_RESPONSES_API
        value: "true"
      - key: OPENAI_STORE_RESPONSES
        value: "true"
      - key: WHATSAPP_REENGAGEMENT_TEMPLATE_LANG
        sync: false
      - key: WHATSAPP_REENGAGEMENT_TEMPLATE
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_MODEL
        sync: false
      - key: APP_PORT
        sync: false
      - key: APP_HOST
        sync: false
      - key: OPENAI_EMBED_MODEL
        value: text-embedding-3-large
      - key: OPENAI_EMBED_DIMENSIONS
        value: "768"
      - key: WHATSAPP_PROVIDER
        value: meta
      - key: PAYMENT_PROVIDER
        value: intasend
      - key: PAYMENT_SIMULATOR
        value: "false"
      - key: INTASEND_TEST_MODE
        value: "false"
      - key: DEMO_PAY_ON_PICKUP
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: hazina-postgres-fra
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: hazina-postgres-fra
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hazina-redis-fra
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: PHONE_HASH_PEPPER
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: META_WA_PHONE_NUMBER_ID
        sync: false
      - key: META_WA_ACCESS_TOKEN
        sync: false
      - key: META_WA_VERIFY_TOKEN
        sync: false
      - key: META_WA_APP_SECRET
        sync: false
      - key: INTASEND_API_TOKEN
        sync: false
      - key: INTASEND_PUBLISHABLE_KEY
        sync: false
      - key: INTASEND_WEBHOOK_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_CORS_ORIGINS
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL_BASE
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.2"

  - name: hazina-redis-fra
    type: keyvalue
    plan: starter
    region: frankfurt
    ipAllowList: []

  - name: hazina-portal
    type: web
    runtime: node
    plan: starter
    region: frankfurt
    rootDir: hazina-portal
    buildCommand: npm install && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    domains:
      - hazina.lesnarai.co.ke
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        value: https://hazina-api.onrender.com
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://hazina-api.onrender.com
      - key: PUBLIC_HAZINA_PORTAL_URL
        value: https://hazina.lesnarai.co.ke
      - key: NEXT_PUBLIC_HAZINA_WHATSAPP
        sync: false
      - key: NEXT_PUBLIC_HAZINA_PHONE
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false

databases:
  - name: hazina-postgres-fra
    plan: basic-256mb
    region: frankfurt
    databaseName: omni
    diskSizeGB: 15
