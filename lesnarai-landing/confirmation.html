<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmed · LESNAR AI LTD</title>
  <meta name="description" content="Your request to LESNAR AI LTD is confirmed. We will be in touch shortly.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a0b">
  <link rel="canonical" href="https://lesnarai.co.ke/confirmation">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-pure: #0a0a0b;
      --bg-deep: #0c0c0d;
      --bg-surface: #131312;
      --text-primary: #f3efe7;
      --text-secondary: #a8a49b;
      --text-tertiary: #807c74;
      --accent-cyan: #c8a878;
      --border: rgba(255, 255, 255, 0.1);
      --border-strong: rgba(255, 255, 255, 0.19);
      --font-display: 'Instrument Sans', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--bg-pure);
      color: var(--text-primary);
      font-family: var(--font-display);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .confirm-card {
      width: min(100%, 540px);
      padding: clamp(2rem, 5vw, 3.5rem);
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--bg-surface);
      text-align: center;
    }
    .confirm-logo {
      display: inline-flex;
      align-items: baseline;
      gap: 0.45rem;
      margin-bottom: 2rem;
      font-family: var(--font-mono);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-decoration: none;
      color: var(--text-primary);
    }
    .confirm-logo span { color: var(--text-tertiary); font-size: 0.8rem; }
    .confirm-tick {
      width: 56px;
      height: 56px;
      margin: 0 auto 1.5rem;
      display: grid;
      place-items: center;
      border: 1px solid var(--accent-cyan);
      border-radius: 50%;
      color: var(--accent-cyan);
      font-size: 1.6rem;
    }
    .confirm-kicker {
      color: var(--accent-cyan);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .confirm-card h1 {
      margin: 0.75rem 0 1rem;
      font-size: clamp(2rem, 6vw, 2.7rem);
      font-weight: 500;
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    .confirm-card p {
      color: var(--text-secondary);
      font-size: 1.02rem;
    }
    .confirm-actions {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    .confirm-actions a {
      min-height: 50px;
      padding: 0.9rem 1.4rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--text-primary);
      transition: border-color 200ms ease, background 200ms ease, color 200ms ease;
    }
    .confirm-actions a.primary {
      border-color: var(--text-primary);
      background: var(--text-primary);
      color: var(--bg-pure);
    }
    .confirm-actions a:hover { border-color: var(--accent-cyan); }
    .confirm-actions a.primary:hover { background: var(--accent-cyan); color: var(--bg-pure); }
  </style>
</head>
<body>
  <main class="confirm-card">
    <a class="confirm-logo" href="/">LESNAR <span>AI LTD</span></a>
    <div class="confirm-tick" aria-hidden="true">&#10003;</div>
    <p class="confirm-kicker">Request confirmed</p>
    <h1>You&rsquo;re all set.</h1>
    <p id="confirm-message">Thank you for reaching out to LESNAR AI LTD. We&rsquo;re opening WhatsApp so you can send us the details &mdash; if it doesn&rsquo;t open automatically, tap the button below.</p>
    <div class="confirm-actions">
      <a class="primary" id="confirm-whatsapp" href="https://wa.me/254715540653" target="_blank" rel="noopener noreferrer">Message us on WhatsApp</a>
      <a href="/">Back to home</a>
    </div>
  </main>
  <script>
    (function () {
      var phone = "254715540653";
      var plans = {
        discovery: "Hi Lesnar AI, I'd like to book a Discovery & scoping sprint.",
        build: "Hi Lesnar AI, I'd like to talk about a Product build.",
        partnership: "Hi Lesnar AI, I'd like to discuss an ongoing engineering partnership."
      };
      var params = new URLSearchParams(window.location.search);
      var plan = params.get("plan");
      var text = (plan && plans[plan]) ? plans[plan] : "Hi Lesnar AI, I'd like to start a project.";
      var url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(text);
      var link = document.getElementById("confirm-whatsapp");
      if (link) link.href = url;
      // Land on this page first (so the visit is recorded), then open WhatsApp.
      window.setTimeout(function () {
        window.location.href = url;
      }, 1400);
    })();
  </script>
</body>
</html>
