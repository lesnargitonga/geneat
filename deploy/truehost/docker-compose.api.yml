services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: geneat-api
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "127.0.0.1:8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app
             --host 0.0.0.0
             --port 8000
             --proxy-headers
             --forwarded-allow-ips='*'
             --workers ${UVICORN_WORKERS:-2}"
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)\nPY"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: geneat-cloudflared
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/81fbd285-69b0-4509-83c3-ea7171a80532.json:/etc/cloudflared/81fbd285-69b0-4509-83c3-ea7171a80532.json:ro

